<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Sponsors</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('fond.jpg.JPG');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      min-height: 100vh;
    }

    nav {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
    }

    nav a {
      margin: 0 15px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    .contenu {
      background-color: rgba(0, 0, 0, 0.6);
      max-width: 800px;
      margin: 100px auto;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
    }

    .sponsor {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .sponsor img {
      width: 80px;
      height: auto;
      margin-right: 20px;
      border-radius: 5px;
    }

    .sponsor-name {
      font-size: 20px;
      font-weight: bold;
      color: white;
    }
  </style>
</head>
<body>

  <nav>
    <a href="accueil.html">Accueil</a>
    <a href="galerie.html">Galerie</a>
    <a href="contact.html">Contact</a>
    <a href="sponsor.html">Sponsor</a>
  </nav>

  <div class="contenu">
    <h1>Nos Sponsors</h1>

    <div class="sponsor">
      <img src="yamaha_logo.png" alt="Yamaha France">
      <div class="sponsor-name">Yamaha France</div>
    </div>

    <div class="sponsor">
      <img src="garage_moto_express_logo.png" alt="Garage Moto Express">
      <div class="sponsor-name">Garage Moto Express</div>
    </div>

    <div class="sponsor">
      <img src="cafe_du_biker_logo.png" alt="Café du Biker">
      <div class="sponsor-name">Café du Biker</div>
    </div>

    <div class="sponsor">
      <img src="casques_co_logo.png" alt="Casques & Co">
      <div class="sponsor-name">Casques & Co</div>
    </div>

    <div class="sponsor">
      <img src="pneus.png" alt="Team Pneus Racing">
      <div class="sponsor-name">Team Pneus Racing</div>
    </div>

  </div>

</body>
</html>
